name: CI

on:
  push:
  pull_request:

jobs:
  prolog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
      - name: Verify complete course
        run: sh scripts/verify-course.sh

  student-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build student OCI
        run: docker build -t eduprolog-student student/
      - name: Smoke-test SWI-Prolog
        run: docker run --rm eduprolog-student swipl --version
      - name: Verify course inside student OCI
        run: |
          docker run --rm -v "$PWD:/work" -w /work eduprolog-student             sh scripts/verify-course.sh

name: CI

on:
  push:
  pull_request:

jobs:
  prolog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
      - name: Verify complete course
        run: sh scripts/verify-course.sh

  student-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build student OCI
        run: docker build -t eduprolog-student -f student/Dockerfile .
      - name: Check environment identity
        run: docker run --rm -v "$PWD:/course" eduprolog-student student-env-info
      - name: Run PLOOS-STUDENT-OCI-1 check
        run: docker run --rm -v "$PWD:/course" eduprolog-student

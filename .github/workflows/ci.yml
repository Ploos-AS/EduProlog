name: CI

on:
  push:
  pull_request:

jobs:
  prolog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
      - name: Load examples
        run: |
          for f in examples/*.pl; do
            echo "Checking $f"
            swipl -q -t halt -s "$f"
          done
      - name: Run course tests
        working-directory: tests
        run: |
          for f in test_*.pl; do
            echo "Testing $f"
            swipl -q -s "$f" -g "run_tests,halt"
          done
      - name: Smoke-test relations
        run: |
          swipl -q -s examples/family.pl -g "grandparent(anna,liv),sibling(ola,kari),halt"

  student-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build student OCI
        run: docker build -t eduprolog-student student/
      - name: Smoke-test SWI-Prolog
        run: docker run --rm eduprolog-student swipl --version

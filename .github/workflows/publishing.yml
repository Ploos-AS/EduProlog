name: Publishing qualification

on:
  push:
    paths:
      - 'publication.yaml'
      - 'course/**'
      - '.github/workflows/publishing.yml'
  pull_request:
    paths:
      - 'publication.yaml'
      - 'course/**'
      - '.github/workflows/publishing.yml'

jobs:
  # Release qualification uses the qualified stable Ploos Publishing v1 contract.
  publishing:
    uses: Ploos-AS/publishing/.github/workflows/reusable-book-validate.yml@v1
    with:
      metadata: publication.yaml
